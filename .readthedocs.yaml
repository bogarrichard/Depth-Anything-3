version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_install:
      # CPU-only torch: RTD builders have no GPU, and the default PyPI wheel
      # would otherwise pull a multi-gigabyte CUDA build for nothing. Must
      # run before the main install step below, which needs torch present
      # to import depth_anything_3 for autodoc.
      - pip install torch --index-url https://download.pytorch.org/whl/cpu

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt
