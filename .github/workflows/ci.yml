name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: ruff check
        run: uvx ruff check src da3_streaming tests
      - name: ruff format --check
        run: uvx ruff format --check src da3_streaming tests

  lock:
    name: lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Fails if pyproject.toml has drifted from uv.lock.
      - run: uv lock --check

  smoke:
    name: import + CLI (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and ceiling. Breakage lives at the edges -- the
        # gradio/python-3.9 conflict that forced the floor to 3.10 is exactly
        # the class of bug this catches.
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Install
        run: uv sync --python ${{ matrix.python }}
      - name: Import the package
        run: uv run --python ${{ matrix.python }} python -c "import depth_anything_3; print(depth_anything_3.__name__)"
      - name: CLI responds
        run: uv run --python ${{ matrix.python }} da3 --help
      - name: Every CLI subcommand builds its parser
        # Typer resolves type annotations at runtime to construct each parser,
        # so this exercises all 112 Option declarations without a model or GPU.
        # This is the guard for the deferred UP007/UP045 migration: if PEP 604
        # unions ever break typer's introspection, these calls fail.
        run: |
          for cmd in auto image images colmap video; do
            echo "--- da3 $cmd --help"
            uv run --python ${{ matrix.python }} da3 "$cmd" --help > /dev/null
          done

  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      # bench is included so the scikit-learn/open3d code paths are installable;
      # open3d has no 3.13 wheels, so that extra is only added on 3.10.
      - name: Install
        run: |
          if [ "${{ matrix.python }}" = "3.10" ]; then
            uv sync --python ${{ matrix.python }} --extra dev --extra bench
          else
            uv sync --python ${{ matrix.python }} --extra dev
          fi
      # `--with e3nn` (rather than `--extra gs`) pulls in just the spherical
      # harmonics dependency: it un-skips the six rotate_sh tests, which are the
      # guard against an e3nn version bump changing the Wigner-D convention.
      # gsplat is deliberately left out -- it compiles CUDA at import time.
      - name: pytest
        run: uv run --python ${{ matrix.python }} --with e3nn python -m pytest
