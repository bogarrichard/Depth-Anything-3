[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "depth-anything-3"
version = "0.0.0"
description = "Depth Anything 3"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Your Name" }]

dependencies = [
    "addict",
    "trimesh",
    "torch>=2",
    "torchvision",
    "einops",
    "huggingface_hub",
    "imageio[ffmpeg]",
    "numpy>=1.26",
    "opencv-python-headless",
    "fastapi",
    "uvicorn",
    "requests",
    "typer>=0.9.0",
    "pillow",
    "omegaconf",
    "matplotlib",
    "pydantic",
    "scipy",
    "tqdm",
    "pypose>=0.9,<0.10",
    "plyfile",
    "safetensors",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest>=8",
    "hypothesis>=6",
    # tomllib is stdlib from 3.11; tests/test_packaging.py needs the backport below that.
    'tomli>=2; python_version < "3.11"',
]
# Building the Sphinx/Read the Docs site under docs/. Not a runtime extra --
# excluded from `all` the same way `dev` is.
docs = [
    "sphinx>=7",
    "myst-parser>=2",
    "sphinx-rtd-theme>=2",
    "sphinx-design>=0.5",
    "sphinxcontrib-typer>=0.5",
    "sphinx-autodoc-typehints>=2",
]
# open3d is used only under src/depth_anything_3/bench/ and has no wheels for
# Python 3.13. Keeping it out of the core install lets the package itself run
# on 3.13.
bench = ["open3d", "scikit-learn"]
app = ["gradio>=5", "pillow>=9.0", "pillow_heif"]
gs = ["gsplat>=1.5,<2", "e3nn"]
# Only utils/export/colmap.py needs this, reached solely via --export-format colmap.
colmap = ["pycolmap"]
# da3_streaming/: long-video / large-scene streaming pipeline. einops and
# safetensors are already core dependencies, so only the rest are listed.
streaming = [
    "faiss-gpu",
    "numba",
    "pandas",
    "prettytable",
    "pyyaml",
    "rich",
    "scikit-learn",
]
all = ["depth-anything-3[app,bench,colmap,gs,streaming]"]


[project.scripts]
da3 = "depth_anything_3.cli:app"

[project.urls]
Homepage = "https://github.com/bogarrichard/Depth-Anything-3"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/depth_anything_3"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/pyproject.toml",
  "/src/depth_anything_3",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes (was flake8), I: isort, UP: pyupgrade
select = ["E", "F", "I", "UP"]
# E203 is handled by the formatter; W503 has no ruff equivalent (it was a
# black-compatibility ignore and is obsolete). E741/E731 carried over.
# E501 is disabled per ruff's own guidance when the formatter is in use: the
# formatter owns line length, so E501 only ever fires on things it cannot
# split -- docstrings, comments, URLs and long string literals.
#
# UP007/UP045 (`Optional[X]`/`Union[X, Y]` -> `X | None`) are correct at the
# 3.10 floor but deferred: they would rewrite 146 sites, and typer, FastAPI
# and pydantic all read these annotations at runtime (cli.py alone has 112
# typer.Option declarations). Enable once there is a test suite to catch a
# regression -- see backlog item 4.
ignore = ["E203", "E501", "E741", "E731", "UP007", "UP045"]

[tool.ruff.lint.pyupgrade]
# Mirrors the previous `pyupgrade --keep-runtime-typing`. Required: without it
# UP006/UP045 rewrite annotations that are evaluated at runtime.
keep-runtime-typing = true

[tool.ruff.lint.isort]
known-first-party = ["depth_anything_3"]
# Matches the previous isort `no_lines_before = "THIRDPARTY"`.
no-lines-before = ["third-party"]

[tool.pytest.ini_options]
# tests/ is on sys.path so conftest helpers can be imported directly.
pythonpath = ["tests"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
