[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "depth-anything-3"
version = "0.0.0"
description = "Depth Anything 3"
readme = "README.md"
requires-python = ">=3.9,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Your Name" }]

dependencies = [
    "trimesh",
    "torch>=2",
    "torchvision",
    "einops",
    "huggingface_hub",
    "imageio",
    "numpy<2",
    "opencv-python-headless",
    "xformers",
    "open3d",
    "fastapi",
    "uvicorn",
    "requests",
    "typer>=0.9.0",
    "pillow",
    "omegaconf",
    "evo",
    "e3nn",
    "moviepy==1.0.3",
    "plyfile",
    "pillow_heif",
    "safetensors",
    "pycolmap",
]

[project.optional-dependencies]
dev = ["pre-commit"]
app = ["gradio>=5", "pillow>=9.0"] # requires that python3>=3.10
gs = ["gsplat @ git+https://github.com/nerfstudio-project/gsplat.git@0b4dddf04cb687367602c01196913cde6a743d70"]
all = ["depth-anything-3[app,gs]"]


[project.scripts]
da3 = "depth_anything_3.cli:app"

[project.urls]
Homepage = "https://github.com/ByteDance-Seed/Depth-Anything-3"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/depth_anything_3"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/pyproject.toml",
  "/src/depth_anything_3",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
plugins = ["jaxtyping.mypy_plugin"]

[tool.ruff]
line-length = 99
target-version = "py39"

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes (was flake8), I: isort, UP: pyupgrade
select = ["E", "F", "I", "UP"]
# E203 is handled by the formatter; W503 has no ruff equivalent (it was a
# black-compatibility ignore and is obsolete). E741/E731 carried over.
ignore = ["E203", "E741", "E731"]

[tool.ruff.lint.pyupgrade]
# Mirrors the previous `pyupgrade --keep-runtime-typing`. Required: without it
# UP006/UP045 rewrite annotations that are evaluated at runtime, which breaks
# the declared Python 3.9 floor.
keep-runtime-typing = true

[tool.ruff.lint.isort]
known-first-party = ["depth_anything_3"]
# Matches the previous isort `no_lines_before = "THIRDPARTY"`.
no-lines-before = ["third-party"]
